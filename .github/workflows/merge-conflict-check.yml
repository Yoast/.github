name: Check PRs for merge conflicts

on:
  # Check for new conflicts due to merges.
  push:
    branches:
      - main
  # Check conflicts in new PRs and for resolved conflicts due to an open PR being updated.
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

# Permissions should be configured at the job level.
permissions: {}

jobs:
  check-prs:
    permissions:
      pull-requests: write # To add and remove labels and comments on a PR.

    if: github.repository_owner == 'Yoast'

    name: Check PRs for merge conflicts
    uses: ./.github/workflows/reusable-merge-conflict-check.yml
